# This is a Declarative Automation Bundle definition for verticeaovivo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: verticeaovivo
  uuid: 773ce5b9-68ba-4a62-8962-2c2feb3fba58

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: lakehouse_vertice
  schema:
    description: The schema to use
  warehouse_id:
    description: SQL Warehouse ID
    default: 62cfca5dd0e0daba
  s3_access_key_id:
    description: chave do data lake (o valor fica fora do Git)
  s3_secret_access_key:
    description: chave do data lake (o valor fica fora do Git)

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-e7bcb52c-110f.cloud.databricks.com
    variables:
      catalog: lakehouse_vertice
      schema: dev
      warehouse_id: 62cfca5dd0e0daba
  prod:
    mode: production
    workspace:
      host: https://dbc-e7bcb52c-110f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/lister.sousa23@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/lister.sousa23@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lakehouse_vertice
      schema: prod
      warehouse_id: 62cfca5dd0e0daba
    permissions:
      - user_name: lister.sousa23@gmail.com
        level: CAN_MANAGE
