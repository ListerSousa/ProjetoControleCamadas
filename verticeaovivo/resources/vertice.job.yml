# Job vertice_farol — Orquestração completa da arquitetura medalhão da Vértice (6 tarefas):
# 1. ingestao_feriados    (em paralelo) : Busca os feriados nacionais de 2026 na BrasilAPI, grava no volume raw e atualiza bronze.feriados.
# 2. ingestao_data_lake   (em paralelo) : Baixa os arquivos do bucket S3 (DataLakeVertice) via boto3 para o volume raw e recria as 9 tabelas da bronze.
# 3. conferencia_bronze   (após 1 e 2)  : Confere as contagens das 9 tabelas da bronze contra o esperado (seed 42) e falha com raise_error() se divergir.
# 4. medalhao             (após 3)      : Roda o pipeline Lakeflow Spark Declarative Pipelines (vertice_medalhao), atualizando as 7 MVs da silver e as 3 MVs da gold.
# 5. testes_de_qualidade  (após 4, par.): Executa a suíte de 10 testes de qualidade cruzando bronze, silver e gold (raise_error se algum falhar).
# 6. status_com_ia        (após 4, par.): Incrementa (MERGE) gold.status_estruturado classificando e extraindo bloqueios via regra, palavra-chave e IA v2.0.

resources:
  jobs:
    vertice_farol:
      name: vertice_farol
      tasks:
        - task_key: ingestao_feriados
          disabled: false
          email_notifications: {}
          environment_key: Task_environment
          notebook_task:
            notebook_path: ../src/01_ingestao_api_gabarito.ipynb
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: ingestao_data_lake
          disabled: false
          email_notifications: {}
          environment_key: Task_environment
          notebook_task:
            base_parameters:
              AWS_ACCESS_KEY_ID: ${var.s3_access_key_id}
              AWS_DEFAULT_REGION: us-east-1
              AWS_SECRET_ACCESS_KEY: ${var.s3_secret_access_key}
              S3_ENDPOINT: https://ldhrqcwufhaokpfcsyxw.storage.supabase.co/storage/v1/s3
            notebook_path: ../src/02_ingestao_boto3_gabarito.py
            source: WORKSPACE
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: conferencia_bronze
          depends_on:
            - task_key: ingestao_feriados
            - task_key: ingestao_data_lake
          sql_task:
            file:
              path: ../src/conferencia/00-conferencia-bronze.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
        - task_key: medalhao
          depends_on:
            - task_key: conferencia_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.vertice_medalhao.id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
        - task_key: testes_de_qualidade
          depends_on:
            - task_key: medalhao
          sql_task:
            file:
              path: ../src/testes/testes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
        - task_key: status_com_ia
          depends_on:
            - task_key: medalhao
          sql_task:
            file:
              path: ../src/ia/status_estruturado.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
      email_notifications:
        no_alert_for_skipped_runs: false
      environments:
        - environment_key: Task_environment
          spec:
            environment_version: "6"
      max_concurrent_runs: 1
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      schedule:
        pause_status: UNPAUSED
        quartz_cron_expression: 0 0 6 ? * MON
        timezone_id: America/Sao_Paulo
      timeout_seconds: 0
      webhook_notifications: {}
